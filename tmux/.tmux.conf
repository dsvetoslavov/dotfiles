set -as terminal-overrides ",*:RGB"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10 
set -g focus-events on

# 1-based, gap-free windows/panes
set -g base-index 1
setw -g pane-base-index 1
setw -g renumber-windows on

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Copy-mode
setw -g mode-keys vi

bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# For tmux 2.6 and above: Copy to macOS clipboard automatically on mouse drag
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Plugins (TPM) — install with `prefix + I`
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
# set -g @plugin 'christoomey/vim-tmux-navigator'

# Catppuccin
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'left'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Keep this as the very last line
run '~/.tmux/plugins/tpm/tpm'
